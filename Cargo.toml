[package]
name = "hold-sccache"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "hold-sccache"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
anyhow = "1"
sigpipe = "0.1"

[dev-dependencies]
tempfile = "3"
